<script type="module">

    import * as maplibregl from
        "https://unpkg.com/maplibre-gl@6.9.0/dist/maplibre-gl.mjs";


    /* ==========================================
       CONFIGURATION
       ========================================== */

    const GOOGLE_SHEET_CSV =
        "https://docs.google.com/spreadsheets/d/e/2PACX-1vQFyCfwrZTOpDkmpHsU2qlNmnVltRGxs0TZLbvRB0EL3d-donR3HdkY1vR4bBFxQtN2X_D0D2c5KW5n/pub?output=csv";


    /* ==========================================
       MAP
       ========================================== */

    const map = new maplibregl.Map({

        container: "map",

        style:
            "https://tiles.openfreemap.org/styles/bright",

        center: [121.0, 23.7],

        zoom: 7.5,

        minZoom: 2,

        maxZoom: 18,

        attributionControl: true

    });


    /* ==========================================
       MAP CONTROLS
       ========================================== */

    map.addControl(
        new maplibregl.NavigationControl({
            showCompass: false
        }),
        "bottom-right"
    );


    /* ==========================================
       LOADING
       ========================================== */

    const loading =
        document.getElementById("loading");


    /* ==========================================
       CSV PARSER
       ========================================== */

    function parseCSV(text) {

        const rows = [];

        let row = [];

        let value = "";

        let insideQuotes = false;


        for (
            let i = 0;
            i < text.length;
            i++
        ) {

            const char = text[i];

            const next = text[i + 1];


            if (
                char === '"' &&
                insideQuotes &&
                next === '"'
            ) {

                value += '"';

                i++;

                continue;
            }


            if (char === '"') {

                insideQuotes =
                    !insideQuotes;

                continue;
            }


            if (
                char === "," &&
                !insideQuotes
            ) {

                row.push(value);

                value = "";

                continue;
            }


            if (
                (char === "\n" ||
                 char === "\r") &&
                !insideQuotes
            ) {

                if (
                    char === "\r" &&
                    next === "\n"
                ) {

                    i++;
                }


                row.push(value);

                rows.push(row);

                row = [];

                value = "";

                continue;
            }


            value += char;
        }


        if (
            value.length > 0 ||
            row.length > 0
        ) {

            row.push(value);

            rows.push(row);
        }


        if (rows.length === 0) {

            return [];
        }


        const headers =
            rows[0].map(
                header => header.trim()
            );


        return rows
            .slice(1)

            .filter(row =>
                row.some(
                    cell =>
                        cell.trim() !== ""
                )
            )

            .map(row => {

                const object = {};


                headers.forEach(
                    (header, index) => {

                        object[header] =
                            (
                                row[index] ||
                                ""
                            ).trim();

                    }
                );


                return object;

            });

    }


    /* ==========================================
       TEXT HELPERS
       ========================================== */

    function escapeHTML(value) {

        return String(value || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /* ==========================================
       CATEGORY HELPERS
       ========================================== */

    function translateCategory(code) {

        const categories = {

            v: "🌱 Pure Vegan · 全素",

            l: "🥚 Lacto-Ovo · 蛋奶素",

            n: "🌿 No Alliums · 植物五辛素",

            d: "🍰 Dessert · 甜品"

        };


        return categories[code] || "";

    }


    function getCategoryCodes(value) {

        if (!value) {

            return [];
        }


        return String(value)

            .toLowerCase()

            .split(",")

            .map(code =>
                code.trim()
            )

            .filter(code =>
                ["v", "l", "n", "d"]
                    .includes(code)
            );

    }


    /* ==========================================
       TIME HELPERS
       ========================================== */

    function timeToMinutes(value) {

        if (!value) {

            return NaN;
        }


        const text =
            String(value).trim();


        if (text.includes(":")) {

            const parts =
                text.split(":");


            const hours =
                Number(parts[0]);


            const minutes =
                Number(parts[1]);


            if (
                Number.isFinite(hours) &&
                Number.isFinite(minutes)
            ) {

                return (
                    hours * 60 +
                    minutes
                );
            }


            return NaN;
        }


        const hour =
            Number(text);


        if (
            Number.isFinite(hour)
        ) {

            return hour * 60;
        }


        return NaN;
    }


    function formatTime(value) {

        if (!value) {

            return "";
        }


        const text =
            String(value).trim();


        if (text.includes(":")) {

            const parts =
                text.split(":");


            const hours =
                Number(parts[0]);


            const minutes =
                Number(parts[1]);


            if (
                Number.isFinite(hours) &&
                Number.isFinite(minutes)
            ) {

                return (
                    String(hours)
                        .padStart(2, "0")
                    +
                    ":"
                    +
                    String(minutes)
                        .padStart(2, "0")
                );
            }


            return text;
        }


        const hour =
            Number(text);


        if (
            Number.isFinite(hour)
        ) {

            return (
                String(hour)
                    .padStart(2, "0")
                +
                ":00"
            );
        }


        return text;
    }


    /* ==========================================
       OPENING STATUS
       ========================================== */

    function getOpenStatus(row) {

        const openMinutes =
            timeToMinutes(
                row.OpenHour
            );


        const closeMinutes =
            timeToMinutes(
                row.CloseHour
            );


        if (
            !Number.isFinite(openMinutes) ||
            !Number.isFinite(closeMinutes)
        ) {

            return {

                isOpen: false,

                known: false

            };
        }


        /*
         * Prototype:
         * Uses the visitor's browser time.
         *
         * Later we can make this
         * restaurant-timezone aware.
         */

        const now =
            new Date();


        const currentMinutes =
            now.getHours() * 60 +
            now.getMinutes();


        let isOpen;


        /*
         * Normal opening:
         *
         * 11:00 → 21:00
         */

        if (
            closeMinutes >
            openMinutes
        ) {

            isOpen =
                currentMinutes >=
                    openMinutes &&
                currentMinutes <
                    closeMinutes;

        }


        /*
         * Overnight opening:
         *
         * 18:00 → 02:00
         */

        else {

            isOpen =
                currentMinutes >=
                    openMinutes ||
                currentMinutes <
                    closeMinutes;

        }


        return {

            isOpen,

            known: true

        };

    }


    /* ==========================================
       CREATE GEOJSON
       ========================================== */

    function createGeoJSON(rows) {

        const features = [];


        for (const row of rows) {

            const latitude =
                Number(
                    row.Latitude
                );


            const longitude =
                Number(
                    row.Longitude
                );


            /*
             * Ignore invalid coordinates.
             */

            if (
                !Number.isFinite(latitude) ||
                !Number.isFinite(longitude)
            ) {

                console.warn(
                    "Invalid coordinates:",
                    row
                );

                continue;
            }


            /* ==============================
               OPEN STATUS
               ============================== */

            const status =
                getOpenStatus(row);


            /* ==============================
               HOURS
               ============================== */

            const openTime =
                formatTime(
                    row.OpenHour
                );


            const closeTime =
                formatTime(
                    row.CloseHour
                );


            const hours =
                openTime &&
                closeTime

                    ? `${openTime} – ${closeTime}`

                    : "Hours unavailable";


            /* ==============================
               NAME
               ============================== */

            const name =
                row.Restaurant ||
                "Vegetarian restaurant";


            /* ==============================
               CATEGORIES
               ============================== */

            const categoryCodes =
                getCategoryCodes(
                    row.Categories
                );


            const categoryLabels =
                categoryCodes

                    .map(code =>
                        translateCategory(code)
                    )

                    .filter(Boolean)

                    .join(" · ");


            /* ==============================
               GOOGLE MAPS
               ============================== */

            const googleMapsURL =
                row.GoogleMaps ||
                row["Google Maps"] ||
                row.MapsLink ||
                row.GoogleMap ||
                "";


            /* ==============================
               GEOJSON FEATURE
               ============================== */

            features.push({

                type: "Feature",

                geometry: {

                    type: "Point",

                    coordinates: [
                        longitude,
                        latitude
                    ]

                },

                properties: {

                    name,

                    categories:
                        categoryCodes.join(","),

                    categoryLabels,

                    hasVegan:
                        categoryCodes.includes("v")
                            ? 1
                            : 0,

                    hasLactoOvo:
                        categoryCodes.includes("l")
                            ? 1
                            : 0,

                    hasNoAlliums:
                        categoryCodes.includes("n")
                            ? 1
                            : 0,

                    hasDessert:
                        categoryCodes.includes("d")
                            ? 1
                            : 0,

                    hours,

                    isOpen:
                        status.isOpen
                            ? 1
                            : 0,

                    statusKnown:
                        status.known
                            ? 1
                            : 0,

                    googleMapsURL

                }

            });
