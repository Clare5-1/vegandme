<script type="module">

    import * as maplibregl from
        "https://unpkg.com/maplibre-gl@6.9.0/dist/maplibre-gl.mjs";


    /* ==========================================
       CONFIGURATION
       ========================================== */

    const GOOGLE_SHEET_CSV =
        "https://docs.google.com/spreadsheets/d/e/2PACX-1vQFyCfwrZTOpDkmpHsU2qlNmnVltRGxs0TZLbvRB0EL3d-donR3HdkY1vR4bBFxQtN2X_D0D2c5KW5n/pub?output=csv";


    /* ==========================================
       MAP
       ========================================== */

    const map = new maplibregl.Map({

        container: "map",

        style:
            "https://tiles.openfreemap.org/styles/bright",

        center: [121.0, 23.7],

        zoom: 7.5,

        minZoom: 2,

        maxZoom: 18,

        attributionControl: true

    });


    /* ==========================================
       CONTROLS
       ========================================== */

    map.addControl(
        new maplibregl.NavigationControl({
            showCompass: false
        }),
        "bottom-right"
    );


    /* ==========================================
       LOADING
       ========================================== */

    const loading =
        document.getElementById("loading");


    /* ==========================================
       CSV PARSER
       ========================================== */

    function parseCSV(text) {

        const rows = [];

        let row = [];

        let value = "";

        let insideQuotes = false;


        for (let i = 0; i < text.length; i++) {

            const char = text[i];

            const next = text[i + 1];


            if (
                char === '"' &&
                insideQuotes &&
                next === '"'
            ) {

                value += '"';

                i++;

                continue;
            }


            if (char === '"') {

                insideQuotes = !insideQuotes;

                continue;
            }


            if (
                char === "," &&
                !insideQuotes
            ) {

                row.push(value);

                value = "";

                continue;
            }


            if (
                (char === "\n" || char === "\r") &&
                !insideQuotes
            ) {

                if (
                    char === "\r" &&
                    next === "\n"
                ) {

                    i++;
                }

                row.push(value);

                rows.push(row);

                row = [];

                value = "";

                continue;
            }


            value += char;
        }


        if (
            value.length > 0 ||
            row.length > 0
        ) {

            row.push(value);

            rows.push(row);
        }


        if (rows.length === 0) {

            return [];
        }


        const headers =
            rows[0].map(
                header => header.trim()
            );


        return rows
            .slice(1)
            .filter(row =>
                row.some(
                    cell => cell.trim() !== ""
                )
            )
            .map(row => {

                const object = {};


                headers.forEach(
                    (header, index) => {

                        object[header] =
                            (row[index] || "").trim();

                    }
                );


                return object;

            });

    }


    /* ==========================================
       TEXT HELPERS
       ========================================== */

    function escapeHTML(value) {

        return String(value || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /* ==========================================
       CATEGORY HELPERS
       ========================================== */

    function translateCategory(code) {

        const categories = {

            v: "🌱 Pure Vegan · 全素",

            l: "🥚 Lacto-Ovo · 蛋奶素",

            n: "🌿 No Alliums · 植物五辛素",

            d: "🍰 Dessert · 甜品"

        };


        return categories[code] || "";

    }


    function getCategoryCodes(value) {

        if (!value) {

            return [];
        }


        return String(value)
            .toLowerCase()
            .split(",")
            .map(code => code.trim())
            .filter(code =>
                ["v", "l", "n", "d"].includes(code)
            );

    }


    /* ==========================================
       TIME HELPERS
       ========================================== */

    function timeToMinutes(value) {

        if (!value) {

            return NaN;
        }


        const text =
            String(value).trim();


        /*
         * Supports:
         *
         * 11
         * 11:00
         * 11:30
         */

        if (text.includes(":")) {

            const parts =
                text.split(":");


            const hours =
                Number(parts[0]);


            const minutes =
                Number(parts[1]);


            if (
                Number.isFinite(hours) &&
                Number.isFinite(minutes)
            ) {

                return hours * 60 + minutes;
            }


            return NaN;
        }


        const hour =
            Number(text);


        if (
            Number.isFinite(hour)
        ) {

            return hour * 60;
        }


        return NaN;
    }


    function formatTime(value) {

        if (!value) {

            return "";
        }


        const text =
            String(value).trim();


        /*
         * Already formatted:
         * 11:00
         */

        if (text.includes(":")) {

            const parts =
                text.split(":");


            const hours =
                Number(parts[0]);


            const minutes =
                Number(parts[1]);


            if (
                Number.isFinite(hours) &&
                Number.isFinite(minutes)
            ) {

                return `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}`;

            }


            return text;
        }


        /*
         * Simple hour:
         * 11 → 11:00
         */

        const hour =
            Number(text);


        if (
            Number.isFinite(hour)
        ) {

            return `${String(hour).padStart(2, "0")}:00`;
        }


        return text;
    }


    /* ==========================================
       OPENING STATUS
       ========================================== */

    function getOpenStatus(row) {

        const openMinutes =
            timeToMinutes(row.OpenHour);


        const closeMinutes =
            timeToMinutes(row.CloseHour);


        /*
         * No valid opening hours
         */

        if (
            !Number.isFinite(openMinutes) ||
            !Number.isFinite(closeMinutes)
        ) {

            return {

                isOpen: false,

                known: false

            };
        }


        /*
         * Browser local time for prototype.
         *
         * Later we can make this restaurant
         * timezone-aware for worldwide use.
         */

        const now =
            new Date();


        const currentMinutes =
            now.getHours() * 60 +
            now.getMinutes();


        let isOpen;


        /*
         * Normal opening:
         *
         * 11:00 → 21:00
         */

        if (
            closeMinutes > openMinutes
        ) {

            isOpen =
                currentMinutes >= openMinutes &&
                currentMinutes < closeMinutes;

        }


        /*
         * Overnight opening:
         *
         * 18:00 → 02:00
         */

        else {

            isOpen =
                currentMinutes >= openMinutes ||
                currentMinutes < closeMinutes;

        }


        return {

            isOpen,

            known: true

        };

    }


    /* ==========================================
       CREATE GEOJSON
       ========================================== */

    function createGeoJSON(rows) {

        const features = [];


        for (const row of rows) {

            const latitude =
                Number(row.Latitude);


            const longitude =
                Number(row.Longitude);


            /*
             * Ignore invalid coordinates.
             */

            if (
                !Number.isFinite(latitude) ||
                !Number.isFinite(longitude)
            ) {

                console.warn(
                    "Invalid coordinates:",
                    row
                );

                continue;
            }


            /* ==============================
               OPEN STATUS
               ============================== */

            const status =
                getOpenStatus(row);


            /* ==============================
               HOURS
               ============================== */

            const openTime =
                formatTime(row.OpenHour);


            const closeTime =
                formatTime(row.CloseHour);


            const hours =
                openTime &&
                closeTime

                    ? `${openTime} – ${closeTime}`

                    : "Hours unavailable";


            /* ==============================
               RESTAURANT NAME
               ============================== */

            const name =
                row.Restaurant ||
                "Vegetarian restaurant";


            /* ==============================
               CATEGORIES
               ============================== */

            const categoryCodes =
                getCategoryCodes(
                    row.Categories
                );


            const categoryLabels =
                categoryCodes
                    .map(code =>
                        translateCategory(code)
                    )
                    .filter(Boolean)
                    .join(" · ");


            /* ==============================
               GOOGLE MAPS
               ============================== */

            const googleMapsURL =
                row.GoogleMaps ||
                row["Google Maps"] ||
                row.MapsLink ||
                row.GoogleMap ||
                "";


            /* ==============================
               GEOJSON FEATURE
               ============================== */

            features.push({

                type: "Feature",

                geometry: {

                    type: "Point",

                    coordinates: [
                        longitude,
                        latitude
                    ]

                },

                properties: {

                    name,

                    categories:
                        categoryCodes.join(","),

                    categoryLabels,

                    hasVegan:
                        categoryCodes.includes("v")
                            ? 1
                            : 0,

                    hasLactoOvo:
                        categoryCodes.includes("l")
                            ? 1
                            : 0,

                    hasNoAlliums:
                        categoryCodes.includes("n")
                            ? 1
                            : 0,

                    hasDessert:
                        categoryCodes.includes("d")
                            ? 1
                            : 0,

                    hours,

                    isOpen:
                        status.isOpen
                            ? 1
                            : 0,

                    statusKnown:
                        status.known
                            ? 1
                            : 0,

                    googleMapsURL

                }

            });

        }


        return {

            type: "FeatureCollection",

            features

        };

    }


    /* ==========================================
       LOAD RESTAURANTS
       ========================================== */

    async function loadRestaurants() {

        try {

            const response =
                await fetch(
                    GOOGLE_SHEET_CSV,
                    {
                        cache: "no-store"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Could not load restaurant data."
                );

            }


            const csv =
                await response.text();


            const rows =
                parseCSV(csv);


            console.log(
                "Google Sheet rows:",
                rows
            );


            const geojson =
                createGeoJSON(rows);


            console.log(
                "Restaurants loaded:",
                geojson.features.length
            );


            /* ==================================
               GEOJSON SOURCE
               ================================== */

            map.addSource(
                "restaurants",
                {

                    type: "geojson",

                    data: geojson,

                    cluster: true,

                    clusterMaxZoom: 13,

                    clusterRadius: 50

                }
            );


            /* ==================================
               CLUSTERS
               ================================== */

            map.addLayer({

                id: "restaurant-clusters",

                type: "circle",

                source: "restaurants",

                filter: [
                    "has",
                    "point_count"
                ],

                paint: {

                    "circle-color":
                        "#245c35",

                    "circle-radius": [

                        "step",

                        [
                            "get",
                            "point_count"
                        ],

                        18,

                        10,
                        22,

                        50,
                        28

                    ],

                    "circle-stroke-width": 2,

                    "circle-stroke-color":
                        "#ffffff"

                }

            });


            /* ==================================
               CLUSTER NUMBER
               ================================== */

            map.addLayer({

                id:
                    "restaurant-cluster-count",

                type: "symbol",

                source: "restaurants",

                filter: [
                    "has",
                    "point_count"
                ],

                layout: {

                    "text-field": [
                        "get",
                        "point_count_abbreviated"
                    ],

                    "text-size": 12

                },

                paint: {

                    "text-color":
                        "#ffffff"

                }

            });


            /* ==================================
               OPEN RESTAURANTS
               ================================== */

            map.addLayer({

                id:
                    "restaurant-open",

                type: "circle",

                source:
                    "restaurants",

                filter: [

                    "all",

                    [
                        "!",
                        [
                            "has",
                            "point_count"
                        ]
                    ],

                    [
                        "==",
                        [
                            "get",
                            "isOpen"
                        ],
                        1
                    ]

                ],

                paint: {

                    "circle-radius": 7,

                    "circle-color":
                        "#3fae5a",

                    "circle-stroke-width":
                        2,

                    "circle-stroke-color":
                        "#ffffff",

                    "circle-opacity":
                        0.95

                }

            });


            /* ==================================
               CLOSED RESTAURANTS
               ================================== */

            map.addLayer({

                id:
                    "restaurant-closed",

                type: "circle",

                source:
                    "restaurants",

                filter: [

                    "all",

                    [
                        "!",
                        [
                            "has",
                            "point_count"
                        ]
                    ],

                    [
                        "==",
                        [
                            "get",
                            "isOpen"
                        ],
                        0
                    ]

                ],

                paint: {

                    "circle-radius": 6,

                    "circle-color":
                        "#a7a7a7",

                    "circle-stroke-width":
                        2,

                    "circle-stroke-color":
                        "#ffffff",

                    "circle-opacity":
                        0.85

                }

            });


            /* ==================================
               CLUSTER CLICK
               ================================== */

            map.on(
                "click",
                "restaurant-clusters",
                async event => {

                    const features =
                        map.queryRenderedFeatures(
                            event.point,
                            {
                                layers: [
                                    "restaurant-clusters"
                                ]
                            }
                        );


                    if (!features.length) {

                        return;
                    }


                    const clusterId =
                        features[0]
                            .properties
                            .cluster_id;


                    const source =
                        map.getSource(
                            "restaurants"
                        );


                    const zoom =
                        await source
                            .getClusterExpansionZoom(
                                clusterId
                            );


                    map.easeTo({

                        center:
                            features[0]
                                .geometry
                                .coordinates,

                        zoom

                    });

                }
            );


            /* ==================================
               RESTAURANT CLICK
               ================================== */

            map.on(
                "click",
                "restaurant-open",
                showRestaurant
            );


            map.on(
                "click",
                "restaurant-closed",
                showRestaurant
            );


            /* ==================================
               CURSOR
               ================================== */

            map.on(
                "mouseenter",
                "restaurant-open",
                () => {

                    map.getCanvas()
                        .style.cursor =
                        "pointer";

                }
            );


            map.on(
                "mouseleave",
                "restaurant-open",
                () => {

                    map.getCanvas()
                        .style.cursor =
                        "";

                }
            );


            map.on(
                "mouseenter",
                "restaurant-closed",
                () => {

                    map.getCanvas()
                        .style.cursor =
                        "pointer";

                }
            );


            map.on(
                "mouseleave",
                "restaurant-closed",
                () => {

                    map.getCanvas()
                        .style.cursor =
                        "";

                }
            );


            /* ==================================
               HIDE LOADING
               ================================== */

            loading.classList.add(
                "hidden"
            );


            /* ==================================
               FIT MAP
               ================================== */

            if (
                geojson.features.length > 0
            ) {

                const bounds =
                    new maplibregl.LngLatBounds();


                for (
                    const feature
                    of geojson.features
                ) {

                    bounds.extend(
                        feature
                            .geometry
                            .coordinates
                    );

                }


                map.fitBounds(
                    bounds,
                    {

                        padding: {

                            top: 160,

                            bottom: 80,

                            left: 40,

                            right: 40

                        },

                        maxZoom: 13,

                        duration: 800

                    }
                );

            }


        } catch (error) {

            console.error(
                "Restaurant loading error:",
                error
            );


            loading.textContent =
                "Unable to load restaurant data.";

        }

    }


    /* ==========================================
       RESTAURANT POPUP
       ========================================== */

    function showRestaurant(event) {

        const feature =
            event.features[0];


        const properties =
            feature.properties;


        const name =
            escapeHTML(
                properties.name
            );


        const hours =
            escapeHTML(
                properties.hours
            );


        const categories =
            escapeHTML(
                properties.categoryLabels ||
                "Vegetarian"
            );


        const isOpen =
            Number(
                properties.isOpen
            ) === 1;


        const statusKnown =
            Number(
                properties.statusKnown
            ) === 1;


        let statusHTML = "";


        if (statusKnown) {

            statusHTML = isOpen

                ? `
                    <div class="status status-open">
                        ● Open now
                    </div>
                  `

                : `
                    <div class="status status-closed">
                        ● Closed
                    </div>
                  `;

        }


        let googleButton = "";


        if (
            properties.googleMapsURL
        ) {

            const safeURL =
                String(
                    properties.googleMapsURL
                )
                .replace(/"/g, "&quot;");


            googleButton = `

                <a
                    class="google-button"
                    href="${safeURL}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    View on Google Maps
                </a>

            `;

        }


        const popupHTML = `

            <div class="restaurant-card">

                <div class="restaurant-name">

                    ${name}

                </div>


                <div class="restaurant-type">

                    ${categories}

                </div>


                <div class="restaurant-hours">

                    ⏰ ${hours}

                </div>


                ${statusHTML}


                ${googleButton}

            </div>

        `;


        new maplibregl.Popup({

            offset: 12,

            closeButton: true,

            closeOnClick: true

        })

            .setLngLat(
                feature.geometry.coordinates
            )

            .setHTML(
                popupHTML
            )

            .addTo(map);

    }


    /* ==========================================
       CATEGORY FILTER
       ========================================== */

    const categoryButtons =
        document.querySelectorAll(
            ".category-button"
        );


    const categoryPropertyMap = {

        "vegan":
            "hasVegan",

        "lacto-ovo":
            "hasLactoOvo",

        "no-alliums":
            "hasNoAlliums",

        "dessert":
            "hasDessert"

    };


    categoryButtons.forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    const selectedCategory =
                        button.dataset.category;


                    /* =========================
                       ACTIVE BUTTON
                       ========================= */

                    categoryButtons.forEach(
                        btn => {

                            btn.classList
                                .remove("active");

                        }
                    );


                    button.classList
                        .add("active");


                    /* =========================
                       BASE FILTER
                       ========================= */

                    const baseFilter = [

                        "!",

                        [
                            "has",
                            "point_count"
                        ]

                    ];


                    let categoryFilter =
                        null;


                    /* =========================
                       CATEGORY FILTER
                       ========================= */

                    if (
                        selectedCategory !==
                        "all"
                    ) {

                        const property =
                            categoryPropertyMap[
                                selectedCategory
                            ];


                        if (property) {

                            categoryFilter = [

                                "==",

                                [
                                    "get",
                                    property
                                ],

                                1

                            ];

                        }

                    }


                    /* =========================
                       FINAL FILTER
                       ========================= */

                    let finalBaseFilter;


                    if (categoryFilter) {

                        finalBaseFilter = [

                            "all",

                            baseFilter,

                            categoryFilter

                        ];

                    } else {

                        finalBaseFilter =
                            baseFilter;

                    }


                    /* =========================
                       OPEN
                       ========================= */

                    map.setFilter(
                        "restaurant-open",
                        [

                            "all",

                            finalBaseFilter,

                            [
                                "==",
                                [
                                    "get",
                                    "isOpen"
                                ],
                                1
                            ]

                        ]
                    );


                    /* =========================
                       CLOSED
                       ========================= */

                    map.setFilter(
                        "restaurant-closed",
                        [

                            "all",

                            finalBaseFilter,

                            [
                                "==",
                                [
                                    "get",
                                    "isOpen"
                                ],
                                0
                            ]

                        ]
                    );

                }
            );

        }
    );


    /* ==========================================
       START
       ========================================== */

    map.on(
        "load",
        () => {

            loadRestaurants();

        }
    );

</script>
