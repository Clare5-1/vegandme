    <!-- =========================

    <script type="module">

        import * as maplibregl from
            "https://unpkg.com/maplibre-gl@6.9.0/dist/maplibre-gl.mjs";


        /* ==========================================
           CONFIGURATION
           ========================================== */

        const GOOGLE_SHEET_CSV =
            "https://docs.google.com/spreadsheets/d/e/2PACX-1vQFyCfwrZTOpDkmpHsU2qlNmnVltRGxs0TZLbvRB0EL3d-donR3HdkY1vR4bBFxQtN2X_D0D2c5KW5n/pub?output=csv";


        /*
         * IMPORTANT
         *
         * This is only our first prototype.
         *
         * Later we will replace this with our
         * own optimized restaurant data system.
         */


        /* ==========================================
           MAP
           ========================================== */

        const map = new maplibregl.Map({

            container: "map",

            /*
             * Temporary demo style.
             *
             * Later we should replace this with
             * our own OpenStreetMap-based style/tile
             * infrastructure.
             */
            style: "https://tiles.openfreemap.org/styles/bright",

            center: [121.0, 23.7],

            zoom: 7.5,

            minZoom: 2,

            maxZoom: 18,

            attributionControl: true
        });


        /* ==========================================
           CONTROLS
           ========================================== */

        map.addControl(
            new maplibregl.NavigationControl({
                showCompass: false
            }),
            "bottom-right"
        );


        /* ==========================================
           LOADING
           ========================================== */

        const loading =
            document.getElementById("loading");


        /* ==========================================
           CSV PARSER
           ========================================== */

        function parseCSV(text) {

            const rows = [];

            let row = [];

            let value = "";

            let insideQuotes = false;


            for (let i = 0; i < text.length; i++) {

                const char = text[i];

                const next = text[i + 1];


                if (char === '"' && insideQuotes && next === '"') {

                    value += '"';

                    i++;

                    continue;
                }


                if (char === '"') {

                    insideQuotes = !insideQuotes;

                    continue;
                }


                if (char === "," && !insideQuotes) {

                    row.push(value);

                    value = "";

                    continue;
                }


                if (
                    (char === "\n" || char === "\r") &&
                    !insideQuotes
                ) {

                    if (char === "\r" && next === "\n") {
                        i++;
                    }

                    row.push(value);

                    rows.push(row);

                    row = [];

                    value = "";

                    continue;
                }


                value += char;
            }


            if (value.length > 0 || row.length > 0) {

                row.push(value);

                rows.push(row);
            }


            if (rows.length === 0) {
                return [];
            }


            const headers = rows[0].map(
                header => header.trim()
            );


            return rows
                .slice(1)
                .filter(row =>
                    row.some(cell => cell.trim() !== "")
                )
                .map(row => {

                    const object = {};

                    headers.forEach((header, index) => {

                        object[header] =
                            (row[index] || "").trim();

                    });

                    return object;
                });
        }


        /* ==========================================
           TEXT HELPERS
           ========================================== */

        function escapeHTML(value) {

            return String(value || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        function translateDietary(tag) {

    if (!tag) {
        return {
            category: "unknown",
            label: "Vegetarian"
        };
    }

    const t = tag
        .toUpperCase()
        .trim();


    /* Pure Vegan */

    if (
        t === "V" ||
        t === "VEGAN" ||
        t.includes("PURE VEGAN") ||
        t.includes("純素") ||
        t.includes("全素")
    ) {
        return {
            category: "vegan",
            label: "🌱 Pure Vegan · 全素"
        };
    }


    /* Lacto-Ovo */

    if (
        t === "VO" ||
        t.includes("LACTO-OVO") ||
        t.includes("OVO-LACTO") ||
        t.includes("LACTO OVO") ||
        t.includes("蛋奶素")
    ) {
        return {
            category: "lacto-ovo",
            label: "🥚 Lacto-Ovo · 蛋奶素"
        };
    }


    /* No Alliums */

    if (
        t === "P" ||
        t.includes("PUNGENT") ||
        t.includes("NO ALLIUM") ||
        t.includes("五辛") ||
        t.includes("植物五辛")
    ) {
        return {
            category: "no-alliums",
            label: "🌿 No Alliums · 植物五辛素"
        };
    }


    /* Dessert */

    if (
        t.includes("DESSERT") ||
        t.includes("甜品") ||
        t.includes("甜點")
    ) {
        return {
            category: "dessert",
            label: "🍰 Dessert · 甜品"
        };
    }


    return {
        category: "unknown",
        label: escapeHTML(tag)
    };
}
        
        function translateShopType(type) {

            if (!type) {
                return "";
            }

            const t =
                type.toUpperCase().trim();


            if (
                t === "PURE" ||
                t === "P" ||
                t.includes("純素")
            ) {
                return "100% Vegetarian";
            }


            if (
                t === "FRIENDLY" ||
                t === "F" ||
                t.includes("葷素")
            ) {
                return "Vegetarian Friendly";
            }


            return escapeHTML(type);
        }


        /* ==========================================
           OPENING HOURS
           ========================================== */

        function getOpenStatus(row) {

            const openHour =
                Number(row.OpenHour);

            const closeHour =
                Number(row.CloseHour);


            if (
                !Number.isFinite(openHour) ||
                !Number.isFinite(closeHour)
            ) {

                return {
                    isOpen: false,
                    known: false
                };
            }


            /*
             * TEMPORARY:
             *
             * This uses browser time for the prototype.
             *
             * We will replace this with restaurant
             * local timezone logic before worldwide launch.
             */

            const now = new Date();

            const currentMinutes =
                now.getHours() * 60 +
                now.getMinutes();


            const openMinutes =
                openHour * 60;

            const closeMinutes =
                closeHour * 60;


            let isOpen;


            /*
             * Normal opening:
             *
             * 11:00 → 21:00
             */

            if (closeMinutes > openMinutes) {

                isOpen =
                    currentMinutes >= openMinutes &&
                    currentMinutes < closeMinutes;

            }

            /*
             * Overnight opening:
             *
             * 18:00 → 02:00
             */

            else {

                isOpen =
                    currentMinutes >= openMinutes ||
                    currentMinutes < closeMinutes;
            }


            return {
                isOpen,
                known: true
            };
        }


        /* ==========================================
           CREATE GEOJSON
           ========================================== */

        function createGeoJSON(rows) {

            const features = [];


            for (const row of rows) {

                const latitude =
                    Number(row.Latitude);

                const longitude =
                    Number(row.Longitude);


                /*
                 * Ignore invalid coordinates.
                 */

                if (
                    !Number.isFinite(latitude) ||
                    !Number.isFinite(longitude)
                ) {
                    continue;
                }


                const status =
                    getOpenStatus(row);


                const openHour =
                    Number(row.OpenHour);

                const closeHour =
                    Number(row.CloseHour);


                const hours =
                    Number.isFinite(openHour) &&
                    Number.isFinite(closeHour)

                        ? `${openHour}:00 – ${closeHour}:00`

                        : "Hours unavailable";


                const name =
                    row.Name ||
                    "Vegetarian restaurant";


                const dietary = translateDietary(
                   row.Tag || row.Dietary
                    );


                const shopType =
                    translateShopType(
                        row.ShopType
                    );


                /*
                 * Your Google Maps URL.
                 *
                 * If your spreadsheet already has
                 * GoogleMaps / Google Maps / MapsLink,
                 * we can use it.
                 */

                const googleMapsURL =
                    row.GoogleMaps ||
                    row["Google Maps"] ||
                    row.MapsLink ||
                    row.GoogleMap ||
                    "";


                features.push({

                    type: "Feature",

                    geometry: {

                        type: "Point",

                        coordinates: [
                            longitude,
                            latitude
                        ]

                    },

                    properties: {

                        name,

                        dietary: dietary.label,

                        category: dietary.category,

                        shopType,

                        hours,

                        isOpen:
                            status.isOpen ? 1 : 0,

                        statusKnown:
                            status.known ? 1 : 0,

                        googleMapsURL

                    }

                });
            }


            return {

                type: "FeatureCollection",

                features
            };
        }


        /* ==========================================
           LOAD RESTAURANTS
           ========================================== */

        async function loadRestaurants() {

            try {

                const response =
                    await fetch(
                        GOOGLE_SHEET_CSV,
                        {
                            cache: "no-store"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Could not load restaurant data."
                    );
                }


                const csv =
                    await response.text();


                const rows =
                    parseCSV(csv);


                const geojson =
                    createGeoJSON(rows);


                /*
                 * Add restaurant data as ONE
                 * GeoJSON source.
                 *
                 * This is important.
                 *
                 * We are NOT creating hundreds
                 * of individual HTML markers.
                 */

                map.addSource(
                    "restaurants",
                    {

                        type: "geojson",

                        data: geojson,

                        /*
                         * This prepares us for
                         * clustering later.
                         */

                        cluster: true,

                        clusterMaxZoom: 13,

                        clusterRadius: 50
                    }
                );


                /* ==================================
                   CLUSTERS
                   ================================== */

                map.addLayer({

                    id: "restaurant-clusters",

                    type: "circle",

                    source: "restaurants",

                    filter: [
                        "has",
                        "point_count"
                    ],

                    paint: {

                        "circle-color": "#245c35",

                        "circle-radius": [
                            "step",

                            [
                                "get",
                                "point_count"
                            ],

                            18,

                            10,
                            22,

                            50,
                            28
                        ],

                        "circle-stroke-width": 2,

                        "circle-stroke-color": "#ffffff"
                    }
                });


                /* ==================================
                   CLUSTER NUMBER
                   ================================== */

                map.addLayer({

                    id: "restaurant-cluster-count",

                    type: "symbol",

                    source: "restaurants",

                    filter: [
                        "has",
                        "point_count"
                    ],

                    layout: {

                        "text-field": [
                            "get",
                            "point_count_abbreviated"
                        ],

                        "text-size": 12
                    },

                    paint: {

                        "text-color": "#ffffff"
                    }
                });


                /* ==================================
                   OPEN RESTAURANTS
                   ================================== */

                map.addLayer({

                    id: "restaurant-open",

                    type: "circle",

                    source: "restaurants",

                    filter: [

                        "all",

                        [
                            "!",
                            [
                                "has",
                                "point_count"
                            ]
                        ],

                        [
                            "==",
                            [
                                "get",
                                "isOpen"
                            ],
                            1
                        ]

                    ],

                    paint: {

                        "circle-radius": 7,

                        "circle-color": "#3fae5a",

                        "circle-stroke-width": 2,

                        "circle-stroke-color": "#ffffff",

                        "circle-opacity": 0.95
                    }
                });


                /* ==================================
                   CLOSED RESTAURANTS
                   ================================== */

                map.addLayer({

                    id: "restaurant-closed",

                    type: "circle",

                    source: "restaurants",

                    filter: [

                        "all",

                        [
                            "!",
                            [
                                "has",
                                "point_count"
                            ]
                        ],

                        [
                            "==",
                            [
                                "get",
                                "isOpen"
                            ],
                            0
                        ]

                    ],

                    paint: {

                        "circle-radius": 6,

                        "circle-color": "#a7a7a7",

                        "circle-stroke-width": 2,

                        "circle-stroke-color": "#ffffff",

                        "circle-opacity": 0.85
                    }
                });


                /* ==================================
                   CLICK CLUSTER
                   ================================== */

                map.on(
                    "click",
                    "restaurant-clusters",
                    async event => {

                        const features =
                            map.queryRenderedFeatures(
                                event.point,
                                {
                                    layers: [
                                        "restaurant-clusters"
                                    ]
                                }
                            );


                        const clusterId =
                            features[0]
                                .properties
                                .cluster_id;


                        const zoom =
                            await map
                                .getSource(
                                    "restaurants"
                                )
                                .getClusterExpansionZoom(
                                    clusterId
                                );


                        map.easeTo({

                            center:
                                features[0]
                                    .geometry
                                    .coordinates,

                            zoom

                        });
                    }
                );


                /* ==================================
                   CLICK RESTAURANT
                   ================================== */

                map.on(
                    "click",
                    "restaurant-open",
                    showRestaurant
                );


                map.on(
                    "click",
                    "restaurant-closed",
                    showRestaurant
                );


                /* ==================================
                   CURSOR
                   ================================== */

                map.on(
                    "mouseenter",
                    "restaurant-open",
                    () => {
                        map.getCanvas().style.cursor =
                            "pointer";
                    }
                );

                map.on(
                    "mouseleave",
                    "restaurant-open",
                    () => {
                        map.getCanvas().style.cursor =
                            "";
                    }
                );


                map.on(
                    "mouseenter",
                    "restaurant-closed",
                    () => {
                        map.getCanvas().style.cursor =
                            "pointer";
                    }
                );

                map.on(
                    "mouseleave",
                    "restaurant-closed",
                    () => {
                        map.getCanvas().style.cursor =
                            "";
                    }
                );


                /*
                 * Hide loading.
                 */

                loading.classList.add("hidden");


                /*
                 * If restaurants exist,
                 * fit the map around them.
                 */

                if (geojson.features.length > 0) {

                    const bounds =
                        new maplibregl.LngLatBounds();


                    for (
                        const feature
                        of geojson.features
                    ) {

                        bounds.extend(
                            feature.geometry.coordinates
                        );
                    }


                    map.fitBounds(
                        bounds,
                        {
                            padding: {
                                top: 100,
                                bottom: 80,
                                left: 40,
                                right: 40
                            },

                            maxZoom: 13,

                            duration: 800
                        }
                    );
                }


            } catch (error) {

                console.error(error);

                loading.textContent =
                    "Unable to load restaurant data.";

            }
        }


        /* ==========================================
           RESTAURANT POPUP
           ========================================== */

        function showRestaurant(event) {

            const feature =
                event.features[0];


            const properties =
                feature.properties;


            const name =
                escapeHTML(properties.name);


            const dietary =
                properties.dietary;


            const shopType =
                properties.shopType;


            const hours =
                escapeHTML(properties.hours);


            const isOpen =
                Number(properties.isOpen) === 1;


            const statusHTML = isOpen

                ? `
                    <div class="status status-open">
                        ● Open now
                    </div>
                  `

                : `
                    <div class="status status-closed">
                        ● Closed
                    </div>
                  `;


            let googleButton = "";


            if (properties.googleMapsURL) {

                const safeURL =
                    String(

        /* ==========================================
   CATEGORY FILTER
   ========================================== */

const categoryButtons =
    document.querySelectorAll(".category-button");


categoryButtons.forEach(button => {

    button.addEventListener("click", () => {

        const selectedCategory =
            button.dataset.category;


        /* ------------------------------
           Update active button
           ------------------------------ */

        categoryButtons.forEach(btn => {
            btn.classList.remove("active");
        });

        button.classList.add("active");


        /* ------------------------------
           Build restaurant filter
           ------------------------------ */

        const baseFilter = [
            "!",
            ["has", "point_count"]
        ];


        let filter;


        if (selectedCategory === "all") {

            filter = baseFilter;

        } else {

            filter = [
                "all",

                baseFilter,

                [
                    "==",
                    ["get", "category"],
                    selectedCategory
                ]
            ];
        }


        /* ------------------------------
           Apply filter
           ------------------------------ */

        map.setFilter(
            "restaurant-open",
            [
                "all",

                filter,

                [
                    "==",
                    ["get", "isOpen"],
                    1
                ]
            ]
        );


        map.setFilter(
            "restaurant-closed",
            [
                "all",

                filter,

                [
                    "==",
                    ["get", "isOpen"],
                    0
                ]
            ]
        );

    });

});

            "load",
            () => {

                loadRestaurants();

            }
        );
